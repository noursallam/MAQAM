<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e2536"/>
      <stop offset="50%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#dcb479" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldBeam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#dcb479" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#C5A059" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="metalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e1b5"/>
      <stop offset="35%" stop-color="#C5A059"/>
      <stop offset="70%" stop-color="#8c6d32"/>
      <stop offset="100%" stop-color="#dcb479"/>
    </linearGradient>
    <linearGradient id="metalDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#333b4d"/>
      <stop offset="100%" stop-color="#161b29"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  
  <!-- Ambient light glow -->
  <circle cx="256" cy="220" r="190" fill="url(#glowGrad)"/>

  <!-- Light beam cone -->
  <polygon points="230,195 282,195 385,440 127,440" fill="url(#goldBeam)"/>

  <!-- Ceiling Mount / Wire -->
  <line x1="256" y1="40" x2="256" y2="135" stroke="url(#metalGold)" stroke-width="4"/>
  <rect x="246" y="32" width="20" height="12" rx="3" fill="url(#metalGold)"/>

  <!-- Cylinder Lamp Body -->
  <rect x="228" y="130" width="56" height="52" rx="6" fill="url(#metalDark)" stroke="url(#metalGold)" stroke-width="2.5"/>
  <line x1="230" y1="155" x2="284" y2="155" stroke="url(#metalGold)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Gold Ring Accent -->
  <rect x="222" y="178" width="68" height="10" rx="3" fill="url(#metalGold)"/>

  <!-- LED Lens Head -->
  <path d="M224,188 L288,188 L296,204 L216,204 Z" fill="url(#metalDark)" stroke="url(#metalGold)" stroke-width="2"/>
  <ellipse cx="256" cy="204" rx="40" ry="12" fill="#fff9e8" filter="url(#softGlow)"/>

  <!-- Light Aura Rings -->
  <ellipse cx="256" cy="390" rx="110" ry="32" fill="none" stroke="url(#metalGold)" stroke-width="1.5" stroke-opacity="0.35"/>
  <ellipse cx="256" cy="415" rx="75" ry="20" fill="none" stroke="url(#metalGold)" stroke-width="1.2" stroke-opacity="0.45"/>
  <ellipse cx="256" cy="415" rx="42" ry="10" fill="#fff4cf" fill-opacity="0.25" filter="url(#softGlow)"/>
</svg>
