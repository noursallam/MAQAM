<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8E9AAF"/>
      <stop offset="100%" stop-color="#6B7A8D"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="85" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="75" fill="none" stroke="#A0ABBE" stroke-width="2"/>
  <!-- Diamond pattern -->
  <g fill="#A0ABBE" opacity="0.5">
    <path d="M80 65 l8 12 l8-12 l-8-12z"/>
    <path d="M100 65 l8 12 l8-12 l-8-12z"/>
    <path d="M120 65 l8 12 l8-12 l-8-12z"/>
    <path d="M90 85 l8 12 l8-12 l-8-12z"/>
    <path d="M110 85 l8 12 l8-12 l-8-12z"/>
    <path d="M80 105 l8 12 l8-12 l-8-12z"/>
    <path d="M100 105 l8 12 l8-12 l-8-12z"/>
    <path d="M120 105 l8 12 l8-12 l-8-12z"/>
  </g>
  <!-- M letter -->
  <text x="100" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="28" fill="#fff" opacity="0.6">STARTER</text>
  <circle cx="100" cy="100" r="85" fill="url(#shine)"/>
</svg>
