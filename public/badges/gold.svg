<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2538"/>
      <stop offset="100%" stop-color="#161B29"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DCB479"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9A7B3C"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8B6D2E"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Ribbon tails -->
  <path d="M75 170 L65 210 L80 195 L95 210 L90 170Z" fill="url(#ribbon)"/>
  <path d="M110 170 L105 210 L120 195 L135 210 L125 170Z" fill="url(#ribbon)"/>
  <!-- Outer gold ring -->
  <circle cx="100" cy="100" r="90" fill="url(#ring)" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="82" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="76" fill="none" stroke="#C5A059" stroke-width="1.5" opacity="0.6"/>
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="48" fill="none" stroke="#C5A059" stroke-width="2.5"/>
  <!-- M -->
  <text x="100" y="114" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="46" fill="#C5A059">M</text>
  <!-- Three stars -->
  <g fill="#DCB479" filter="url(#glow)">
    <polygon points="70,25 73,34 82,34 75,39 77,48 70,43 63,48 65,39 58,34 67,34"/>
    <polygon points="100,18 103,27 112,27 105,32 107,41 100,36 93,41 95,32 88,27 97,27"/>
    <polygon points="130,25 133,34 142,34 135,39 137,48 130,43 123,48 125,39 118,34 127,34"/>
  </g>
  <circle cx="100" cy="100" r="90" fill="url(#shine)"/>
</svg>
