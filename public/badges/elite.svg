<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2538"/>
      <stop offset="100%" stop-color="#0F1320"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5DFA0"/>
      <stop offset="30%" stop-color="#DCB479"/>
      <stop offset="60%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8B6D2E"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Shield -->
  <path d="M100 8 L188 55 L188 135 Q188 185 100 218 Q12 185 12 135 L12 55Z" fill="url(#metal)" filter="url(#shadow)"/>
  <path d="M100 20 L178 62 L178 132 Q178 178 100 208 Q22 178 22 132 L22 62Z" fill="url(#bg)"/>
  <!-- Laurel wreath -->
  <g fill="none" stroke="#C5A059" stroke-width="2" opacity="0.7">
    <!-- Left laurel -->
    <path d="M42 145 Q38 125 45 105"/>
    <path d="M38 140 Q32 125 36 108"/>
    <path d="M42 130 Q35 118 38 103"/>
    <!-- Right laurel -->
    <path d="M158 145 Q162 125 155 105"/>
    <path d="M162 140 Q168 125 164 108"/>
    <path d="M158 130 Q165 118 162 103"/>
  </g>
  <!-- Laurel leaves -->
  <g fill="#C5A059" opacity="0.5">
    <ellipse cx="42" cy="120" rx="5" ry="10" transform="rotate(-15 42 120)"/>
    <ellipse cx="38" cy="108" rx="4" ry="9" transform="rotate(-20 38 108)"/>
    <ellipse cx="45" cy="132" rx="5" ry="10" transform="rotate(-5 45 132)"/>
    <ellipse cx="158" cy="120" rx="5" ry="10" transform="rotate(15 158 120)"/>
    <ellipse cx="162" cy="108" rx="4" ry="9" transform="rotate(20 162 108)"/>
    <ellipse cx="155" cy="132" rx="5" ry="10" transform="rotate(5 155 132)"/>
  </g>
  <!-- Three stars top -->
  <g fill="#DCB479" filter="url(#glow)">
    <polygon points="65,35 67.5,43 76,43 69.5,48 72,56 65,51 58,56 60.5,48 54,43 62.5,43"/>
    <polygon points="100,25 103,34 112,34 105,40 108,49 100,43 92,49 95,40 88,34 97,34"/>
    <polygon points="135,35 137.5,43 146,43 139.5,48 142,56 135,51 128,56 130.5,48 124,43 132.5,43"/>
  </g>
  <!-- M -->
  <text x="100" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="52" fill="#DCB479">M</text>
  <!-- Star bottom center -->
  <polygon points="100,168 103,177 112,177 105,183 108,192 100,186 92,192 95,183 88,177 97,177" fill="#C5A059" opacity="0.8"/>
  <path d="M100 8 L188 55 L188 135 Q188 185 100 218 Q12 185 12 135 L12 55Z" fill="url(#shine)"/>
</svg>
