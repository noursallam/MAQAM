<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CD8032"/>
      <stop offset="100%" stop-color="#A0652A"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8A850"/>
      <stop offset="100%" stop-color="#8B5E2B"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#5a3510" flood-opacity="0.4"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="88" fill="url(#ring)" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="78" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="72" fill="none" stroke="#E8A850" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="48" fill="none" stroke="#E8A850" stroke-width="2"/>
  <!-- M -->
  <text x="100" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="42" fill="#fff">M</text>
  <!-- Star -->
  <polygon points="100,28 103,38 113,38 105,44 108,54 100,48 92,54 95,44 87,38 97,38" fill="#E8A850" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="88" fill="url(#shine)"/>
</svg>
