<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2538"/>
      <stop offset="100%" stop-color="#0D1018"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5DFA0"/>
      <stop offset="25%" stop-color="#DCB479"/>
      <stop offset="50%" stop-color="#E8C88A"/>
      <stop offset="75%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8B6D2E"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Ornate scalloped outer edge -->
  <path d="M110 10 Q130 10 140 25 Q155 18 162 35 Q178 33 180 50 Q195 55 190 72 Q202 82 195 98 Q205 110 195 122 Q202 138 190 148 Q195 165 180 170 Q178 187 162 185 Q155 202 140 195 Q130 210 110 210 Q90 210 80 195 Q65 202 58 185 Q42 187 40 170 Q25 165 30 148 Q18 138 25 122 Q15 110 25 98 Q18 82 30 72 Q25 55 40 50 Q42 33 58 35 Q65 18 80 25 Q90 10 110 10Z" fill="url(#metal)" filter="url(#shadow)"/>
  <path d="M110 24 Q126 24 134 36 Q147 30 153 44 Q166 42 167 56 Q179 60 175 73 Q186 81 180 94 Q189 104 180 115 Q186 128 175 136 Q179 150 167 153 Q166 167 153 165 Q147 179 134 173 Q126 185 110 185 Q94 185 86 173 Q73 179 67 165 Q54 167 53 153 Q41 150 45 136 Q34 128 40 115 Q31 104 40 94 Q34 81 45 73 Q41 60 53 56 Q54 42 67 44 Q73 30 86 36 Q94 24 110 24Z" fill="url(#bg)"/>
  <!-- Laurel wreath inside -->
  <g fill="#C5A059" opacity="0.55">
    <!-- Left -->
    <ellipse cx="55" cy="85" rx="5" ry="11" transform="rotate(-25 55 85)"/>
    <ellipse cx="50" cy="100" rx="5" ry="11" transform="rotate(-15 50 100)"/>
    <ellipse cx="50" cy="115" rx="5" ry="11" transform="rotate(-5 50 115)"/>
    <ellipse cx="53" cy="130" rx="5" ry="11" transform="rotate(5 53 130)"/>
    <ellipse cx="58" cy="143" rx="5" ry="10" transform="rotate(15 58 143)"/>
    <!-- Right -->
    <ellipse cx="165" cy="85" rx="5" ry="11" transform="rotate(25 165 85)"/>
    <ellipse cx="170" cy="100" rx="5" ry="11" transform="rotate(15 170 100)"/>
    <ellipse cx="170" cy="115" rx="5" ry="11" transform="rotate(5 170 115)"/>
    <ellipse cx="167" cy="130" rx="5" ry="11" transform="rotate(-5 167 130)"/>
    <ellipse cx="162" cy="143" rx="5" ry="10" transform="rotate(-15 162 143)"/>
  </g>
  <!-- Five stars arc -->
  <g fill="#F0D496" filter="url(#glow)">
    <polygon points="60,52 62,58 68,58 63,62 65,68 60,64 55,68 57,62 52,58 58,58"/>
    <polygon points="82,35 84,41 90,41 85,45 87,51 82,47 77,51 79,45 74,41 80,41"/>
    <polygon points="110,28 113,36 121,36 115,41 117,49 110,44 103,49 105,41 99,36 107,36"/>
    <polygon points="138,35 140,41 146,41 141,45 143,51 138,47 133,51 135,45 130,41 136,41"/>
    <polygon points="160,52 162,58 168,58 163,62 165,68 160,64 155,68 157,62 152,58 158,58"/>
  </g>
  <!-- M -->
  <text x="110" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="52" fill="#F0D496" filter="url(#bigglow)">M</text>
  <!-- Bottom stars -->
  <g fill="#C5A059" opacity="0.8">
    <polygon points="82,163 84,168 89,168 85,172 87,177 82,173 77,177 79,172 75,168 80,168"/>
    <polygon points="110,168 112,173 117,173 113,177 115,182 110,178 105,182 107,177 103,173 108,173"/>
    <polygon points="138,163 140,168 145,168 141,172 143,177 138,173 133,177 135,172 131,168 136,168"/>
  </g>
  <path d="M110 10 Q130 10 140 25 Q155 18 162 35 Q178 33 180 50 Q195 55 190 72 Q202 82 195 98 Q205 110 195 122 Q202 138 190 148 Q195 165 180 170 Q178 187 162 185 Q155 202 140 195 Q130 210 110 210 Q90 210 80 195 Q65 202 58 185 Q42 187 40 170 Q25 165 30 148 Q18 138 25 122 Q15 110 25 98 Q18 82 30 72 Q25 55 40 50 Q42 33 58 35 Q65 18 80 25 Q90 10 110 10Z" fill="url(#shine)"/>
</svg>
