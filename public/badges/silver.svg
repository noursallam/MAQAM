<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C0C7D0"/>
      <stop offset="100%" stop-color="#8A95A5"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0E5EB"/>
      <stop offset="100%" stop-color="#7A8594"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#3a4555" flood-opacity="0.35"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="88" fill="url(#ring)" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="78" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="72" fill="none" stroke="#D5DAE1" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="48" fill="none" stroke="#D5DAE1" stroke-width="2"/>
  <!-- M -->
  <text x="100" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="42" fill="#fff">M</text>
  <!-- Two stars -->
  <g fill="#D5DAE1" filter="url(#glow)">
    <polygon points="85,30 87.5,38 96,38 89.5,43 92,51 85,46 78,51 80.5,43 74,38 82.5,38"/>
    <polygon points="115,30 117.5,38 126,38 119.5,43 122,51 115,46 108,51 110.5,43 104,38 112.5,38"/>
  </g>
  <circle cx="100" cy="100" r="88" fill="url(#shine)"/>
</svg>
